[package]
name = "concurrent-sharded-stack"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Sharded intrusive stacks with pluggable reclamation and cached value storage."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhongyi51/concurrent-sharded-stack"
readme = "README.md"
keywords = ["concurrent", "lock-free", "stack", "sharded", "treiber"]
categories = ["concurrency", "data-structures"]
publish = ["crates-io"]

[features]
default = ["intrusive"]
intrusive = []

[dependencies]
crossbeam-epoch = "0.9"
crossbeam-utils = "0.8"
intrusive-collections = "0.10.3"
crossbeam-queue = "0.3"
scopeguard = "1.2"

[dev-dependencies]
criterion = "0.5"
lockfree = "0.5"

[[bench]]
name = "stack_bench"
harness = false

[[bench]]
name = "intrusive_bench"
harness = false

[[example]]
name = "intrusive_recycling"

[[bench]]
name = "retirement_profile"
harness = false

# Profiling-friendly release build: keep full debuginfo so VTune (or any other
# sampling profiler) can resolve symbols and inline frames, without disabling
# any optimisation.
[profile.release]
debug = "full"
split-debuginfo = "packed"
strip = "none"

[[bench]]
name = "cache_profile"
harness = false
