[package]
name = "concurrent-sharded-stack"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "Lock-free sharded stacks with epoch reclamation and optional intrusive node storage."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhongyi51/concurrent-sharded-stack"
readme = "README.md"
keywords = ["concurrent", "lock-free", "stack", "sharded", "treiber"]
categories = ["concurrency", "data-structures"]
publish = ["crates-io"]

[features]
default = ["intrusive"]
intrusive = ["dep:intrusive-collections"]

[dependencies]
crossbeam-epoch = "0.9"
crossbeam-utils = "0.8"
intrusive-collections = { version = "0.10.3", optional = true }
scopeguard = "1.2"

[dev-dependencies]
criterion = "0.5"
crossbeam-queue = "0.3"
lockfree = "0.5"

[[bench]]
name = "stack_bench"
harness = false

[[bench]]
name = "intrusive_bench"
harness = false
required-features = ["intrusive"]

[[example]]
name = "intrusive_recycling"
required-features = ["intrusive"]

[[bench]]
name = "retirement_profile"
harness = false
required-features = ["intrusive"]

# Profiling-friendly release build: keep full debuginfo so VTune (or any other
# sampling profiler) can resolve symbols and inline frames, without disabling
# any optimisation.
[profile.release]
debug = "full"
split-debuginfo = "packed"
strip = "none"
